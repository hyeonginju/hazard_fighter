<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>시켜줘, 명예소방관</title>
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#c62828" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>🚨 시켜줘, 명예소방관</h1>
    <p class="subtitle">가족 맞춤 안전 알림 구독</p>
  </header>

  <main>
    <!-- 인앱 브라우저(카톡 등) 안내 — inapp.js 가 감지되면 채워서 보여준다 -->
    <div id="inapp-notice" class="notice" hidden>
      <p id="inapp-message"></p>
      <button type="button" id="btn-open-external" hidden>Chrome·Safari 로 열기</button>
      <button type="button" id="btn-copy-url" hidden>주소 복사하기</button>
    </div>

    <!-- 로그인 사용자 정보 (/auth/me) -->
    <div id="user-bar">
      <span id="user-info">불러오는 중…</span>
      <button type="button" id="btn-logout" class="small">로그아웃</button>
    </div>

    <!-- 하나의 폼: 보호 대상 + 지역 → 알림 켜기까지 한 번에 -->
    <section>
      <h2>보호 대상 알림 등록</h2>
      <form id="form-register">
        <label class="field-label" for="input-person-label">보호 대상</label>
        <input type="text" id="input-person-label" placeholder="호칭 (예: 어머니)" required />
        <select id="input-age-group"></select>
        <fieldset id="input-tags">
          <legend>고려사항 태그 (해당되는 것만)</legend>
        </fieldset>

        <label class="field-label">지역</label>
        <select id="input-sido" required></select>
        <select id="input-sigungu" required disabled></select>

        <button type="submit" id="btn-register">보호 대상 알림 추가하기</button>
        <p id="register-status" class="status"></p>
      </form>
    </section>

    <!-- 등록된 알림 (구독 목록) -->
    <section>
      <h2>등록된 알림</h2>
      <!-- 초기 문구는 로딩 표시 — 서버가 잠들어 있었으면(콜드 스타트) 응답이 몇 초 걸린다 -->
      <ul id="subscription-list" class="card-list"><li class="empty">불러오는 중…</li></ul>
    </section>

    <!-- 알림 내역 -->
    <section>
      <h2>알림 내역 <button id="btn-refresh" class="small">새로고침</button></h2>
      <ul id="notification-list" class="card-list"><li class="empty">불러오는 중…</li></ul>
    </section>
  </main>

  <footer>
    <p>공공데이터 기반 개인 맞춤형 이상상황 알림 · <a href="/docs">API 문서</a></p>
  </footer>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
