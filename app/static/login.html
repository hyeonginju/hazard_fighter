<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>로그인 — 시켜줘, 명예소방관</title>
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#c62828" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>🚨 시켜줘, 명예소방관</h1>
    <p class="subtitle">가족 맞춤 안전 알림 구독</p>
  </header>

  <main>
    <section class="login-card">
      <h2>시작하기</h2>
      <p class="hint">간편 로그인 한 번이면 끝나요. 이메일·비밀번호는 받지 않아요.</p>

      <a class="social-btn kakao" href="/auth/kakao/login" id="btn-kakao">
        <span>💬 카카오로 시작하기</span>
        <small class="last-badge" id="badge-kakao" hidden>✓ 지난번에 이 방법으로 로그인했어요</small>
      </a>
      <a class="social-btn google" href="/auth/google/login" id="btn-google">
        <span>G 구글로 시작하기</span>
        <small class="last-badge" id="badge-google" hidden>✓ 지난번에 이 방법으로 로그인했어요</small>
      </a>

      <p id="login-status" class="status"></p>
    </section>
  </main>

  <footer>
    <p>공공데이터 기반 개인 맞춤형 이상상황 알림 · <a href="/docs">API 문서</a></p>
  </footer>

  <script type="module" src="/static/login.js"></script>
</body>
</html>
