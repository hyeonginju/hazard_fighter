services:
  db:
    image: postgres:16
    container_name: hazard_fighter_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hazard
      POSTGRES_PASSWORD: hazard
      POSTGRES_DB: hazard_fighter
    ports:
      - "5432:5432"
    volumes:
      - hazard_fighter_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hazard -d hazard_fighter"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: hazard_fighter_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://hazard:hazard@db:5432/hazard_fighter
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/code/app

volumes:
  hazard_fighter_pgdata:
