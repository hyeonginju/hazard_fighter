<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>구독 화면 (데모) — 시켜줘, 명예소방관</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#c62828" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="demo-banner">
    <strong>정적 데모입니다.</strong> 실제 UI를 샘플 데이터로 재현한 화면으로, 입력과 발송은 동작하지 않습니다.
    · <a href="/">프로젝트 소개로</a>
  </div>

  <header>
    <h1>🚨 시켜줘, 명예소방관</h1>
    <p class="subtitle">가족 맞춤 안전 알림 구독</p>
  </header>

  <main>
    <div id="user-bar">
      <span id="user-info">불러오는 중…</span>
      <button type="button" id="btn-logout" class="small">로그아웃</button>
    </div>

    <p id="push-status" class="status">알림 기기 확인 중…</p>

    <section>
      <h2>보호 대상 알림 등록</h2>
      <form id="form-register">
        <label class="field-label" for="input-person-label">보호 대상</label>
        <input type="text" id="input-person-label" placeholder="호칭 (예: 어머니)" required />
        <select id="input-age-group"></select>
        <fieldset id="input-tags">
          <legend>고려사항 태그 (해당되는 것만)</legend>
        </fieldset>

        <label class="field-label">지역</label>
        <select id="input-sido" required></select>
        <select id="input-sigungu" required disabled></select>

        <button type="submit" id="btn-register">보호 대상 알림 추가하기</button>
        <p id="register-status" class="status"></p>
      </form>
    </section>

    <section>
      <h2>등록된 알림</h2>
      <ul id="subscription-list" class="card-list"><li class="empty">불러오는 중…</li></ul>
    </section>

    <section>
      <h2>알림 내역 <button id="btn-refresh" class="small">새로고침</button></h2>
      <ul id="notification-list" class="card-list"><li class="empty">불러오는 중…</li></ul>
    </section>
  </main>

  <footer>
    <p>공공데이터 기반 개인 맞춤형 이상상황 알림 · <a href="/">프로젝트 소개</a></p>
  </footer>

  <script type="module" src="/static/demo-app.js"></script>
</body>
</html>
